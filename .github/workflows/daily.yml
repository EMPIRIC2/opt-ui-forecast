name: Daily forecast update

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build today's forecast
        run: |
          python download_s2s_forecast.py
          python convert_standardize_s2s.py
          python community_forecast.py

      - name: Publish refreshed data
        run: |
          git config user.name "forecast-bot"
          git config user.email "actions@users.noreply.github.com"

          git add forecast_data.js community_forecast.csv community_summary.txt forecast_*.png

          if git diff --staged --quiet; then
            echo "No forecast changes to commit."
          else
            git commit -m "Daily forecast update $(date -u +%F)"
            git push
          fi
